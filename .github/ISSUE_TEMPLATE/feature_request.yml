name: Feature request
description: An idea for glance.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help with?
      description: The situation or problem, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working. Hotkeys, settings or overlay changes are all welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: glance keeps screenshots and audio on your Mac and talks only to local model servers (see SECURITY.md).
      options:
        - label: This idea keeps everything local, or I've explained why it shouldn't.
