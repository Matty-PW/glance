name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  check:
    # arm64 macOS: glance v1 targets Apple Silicon only.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Pinned to a commit, not a tag. This is the only third-party action used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
          persist-credentials: false

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install audit tools
        run: brew install cargo-audit cargo-deny gitleaks

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Advisories (cargo audit)
        run: cargo audit

      - name: Licences, bans, sources (cargo deny)
        run: cargo deny check

      - name: Secrets and personal paths (gitleaks)
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .
