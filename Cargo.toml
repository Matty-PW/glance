[workspace]
resolver = "3"
members = ["crates/*"]
# Throwaway experiments with their own Cargo.toml; never part of the build.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
# Crates that need `unsafe` (platform bindings) must opt out explicitly and say why.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[workspace.dependencies]
# Internal crates.
glance-audio = { path = "crates/audio" }
glance-capture = { path = "crates/capture" }
glance-llm-client = { path = "crates/llm-client" }
glance-models = { path = "crates/models" }
glance-orchestrator = { path = "crates/orchestrator" }
glance-stt = { path = "crates/stt" }
glance-tts = { path = "crates/tts" }

# External crates are added here, one milestone at a time, with exact pins
# (`=x.y.z`) and only after reading their current docs.rs pages (see CLAUDE.md).
anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
cpal = "=0.18.2"
# PNG only: decode the supplied screenshot, downscale, re-encode.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# rustls only (no native-tls/OpenSSL). Used by `models` and `llm-client` only;
# deny.toml enforces that.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
rubato = "=5.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
toml = "=1.2.1"
# Parakeet via ONNX Runtime. See docs/DESIGN.md §5 and §6.4.
transcribe-rs = { version = "=0.3.12", features = ["onnx"] }
# transcribe-rs 0.3.12 does not compile against ort rc.13+ (API change between
# release candidates), so ort is held at the version it was written against.
# Its build script downloads ONNX Runtime 1.24.2 from cdn.pyke.io and checks it
# against a SHA-256 shipped in the crate (docs/DESIGN.md §6.4 fallback).
ort = "=2.0.0-rc.12"
# Bindings to Apple frameworks, used by the system-voice TTS (AVSpeechSynthesizer).
objc2 = "=0.6.5"
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["std", "AVSpeechSynthesis"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSRunLoop", "NSDate", "NSObjCRuntime"] }
# M2: live screen capture (ScreenCaptureKit) and the frontmost-app lookup.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGWindow", "CGDirectDisplay"] }
screencapturekit = { version = "=11.1.2", features = ["macos_14_0"] }
# M2: the menu-bar app. Carbon hotkeys (no Input Monitoring permission), the
# tray icon and menu (Linux backends off), and the main dispatch queue for
# handing tray updates to the main thread.
global-hotkey = "=0.10.0"
tray-icon = { version = "=0.26.1", default-features = false }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
# M2: microphone permission status (`AVCaptureDevice`) for the permission checklist.
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat"] }
